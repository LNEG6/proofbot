<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 716" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What Proofbot does</title>
  <desc>A request goes to three readers spread apart on purpose. Code compares their readings on every input. One meaning goes straight to work. More than one meaning goes to a person first. Then the doer works and sealed checks decide the verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .sub { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .line { stroke: #888780; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .person rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; } .person .title { fill: #712B13; } .person .sub { fill: #993C1D; }
      .agent rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; } .agent .title { fill: #3C3489; } .agent .sub { fill: #534AB7; }
      .code rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; } .code .title { fill: #085041; } .code .sub { fill: #0F6E56; }
      .key { font-size: 12px; fill: #5F5E5A; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="680" height="716" rx="12" fill="#FFFFFF"/>
  <g class="person"><rect x="190" y="30" width="300" height="56" rx="8"/><text class="title" x="340" y="49">You ask in the team chat</text><text class="sub" x="340" y="68">Capitalize the customer's name</text></g>
  <line class="line" x1="290" y1="86" x2="130" y2="124"/><line class="line" x1="340" y1="86" x2="340" y2="124"/><line class="line" x1="390" y1="86" x2="550" y2="124"/>
  <g class="agent"><rect x="40" y="126" width="180" height="56" rx="8"/><text class="title" x="130" y="145">Literal reader</text><text class="sub" x="130" y="164">The exact words only</text></g>
  <g class="agent"><rect x="250" y="126" width="180" height="56" rx="8"/><text class="title" x="340" y="145">Intent reader</text><text class="sub" x="340" y="164">What you actually want</text></g>
  <g class="agent"><rect x="460" y="126" width="180" height="56" rx="8"/><text class="title" x="550" y="145">Rival reader</text><text class="sub" x="550" y="164">Must find another meaning</text></g>
  <line class="line" x1="130" y1="182" x2="280" y2="220"/><line class="line" x1="340" y1="182" x2="340" y2="220"/><line class="line" x1="550" y1="182" x2="400" y2="220"/>
  <g class="code"><rect x="170" y="222" width="340" height="56" rx="8"/><text class="title" x="340" y="241">Code compares every reading</text><text class="sub" x="340" y="260">On every input, with no AI</text></g>
  <line class="line" x1="260" y1="278" x2="180" y2="326"/><line class="line" x1="420" y1="278" x2="500" y2="326"/>
  <g class="code"><rect x="60" y="328" width="240" height="56" rx="8"/><text class="title" x="180" y="347">One meaning</text><text class="sub" x="180" y="366">Nobody gets bothered</text></g>
  <g class="agent"><rect x="380" y="328" width="240" height="56" rx="8"/><text class="title" x="500" y="347">More than one meaning</text><text class="sub" x="500" y="366">Referee asks the room</text></g>
  <line class="line" x1="500" y1="384" x2="500" y2="418"/>
  <g class="person"><rect x="380" y="420" width="240" height="56" rx="8"/><text class="title" x="500" y="439">A person answers</text><text class="sub" x="500" y="458">John smith or John Smith?</text></g>
  <path class="line" d="M180 384 L180 540 L218 540"/><path class="line" d="M500 476 L500 540 L462 540"/>
  <g class="agent"><rect x="220" y="512" width="240" height="56" rx="8"/><text class="title" x="340" y="531">Doer does the work</text><text class="sub" x="340" y="550">Checks are sealed first</text></g>
  <line class="line" x1="340" y1="568" x2="340" y2="602"/>
  <g class="code"><rect x="170" y="604" width="340" height="56" rx="8"/><text class="title" x="340" y="623">Harness decides if it's really done</text><text class="sub" x="340" y="642">Referee posts it, not the doer</text></g>
  <g class="person"><rect x="150" y="684" width="12" height="12" rx="3"/></g><text class="key" x="168" y="690">People</text>
  <g class="agent"><rect x="250" y="684" width="12" height="12" rx="3"/></g><text class="key" x="268" y="690">AI agents</text>
  <g class="code"><rect x="360" y="684" width="12" height="12" rx="3"/></g><text class="key" x="378" y="690">Plain code, no AI</text>
</svg>
